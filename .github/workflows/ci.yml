name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Every version the package claims, plus both free-threaded builds. Free-threaded runs the
        # same suite with the GIL disabled: it proves the code does not depend on the GIL, not that
        # concurrent threads can share a Session. 3.13t stays out; free-threading only reached
        # stable support in 3.14 (PEP 779).
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai,anthropic,schema]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  extras:
    name: ${{ matrix.extra }} extra installs alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Each provider extra must install and pass its adapter suite without the other SDK, which
        # proves the extras are independent and that the core package carries neither dependency.
        extra: [openai, anthropic]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install only this extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,${{ matrix.extra }}]"

      - name: Import the adapter without the other SDK
        run: python -c "import pi_durable.providers.${{ matrix.extra }}"

      - name: Test the adapter and the extras independence cases
        run: pytest tests/test_providers_${{ matrix.extra }}.py tests/test_providers_extras.py
