[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-durable"
version = "0.1.0"
description = "Durable conversation, task, and document runtime for Python (port of @earendil-works/pi-durable)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Earendil Works" }]
keywords = ["durable-execution", "agents", "conversations", "tasks"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_durable"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
