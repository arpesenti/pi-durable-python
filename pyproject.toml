[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-durable-python"
version = "1.3.0"
description = "Python port of @earendil-works/pi-durable v1.3.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Armando Pesenti Gritti" }]
keywords = ["durable-execution", "agents", "conversations", "tasks", "pi", "port"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
schema = ["jsonschema>=4.20"]
all = ["openai>=1.0", "anthropic>=0.40", "jsonschema>=4.20"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/arpesenti/pi-durable-python"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/durable"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_durable"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pi_durable"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pi_durable.storage.memory"]
disable_error_code = ["arg-type", "typeddict-item", "assignment", "index", "call-overload", "var-annotated", "union-attr"]

[[tool.mypy.overrides]]
module = ["pi_durable.session.transaction"]
disable_error_code = ["typeddict-item", "arg-type", "assignment", "index", "call-overload", "union-attr", "var-annotated"]

[[tool.mypy.overrides]]
module = ["test_memory_storage"]
disable_error_code = ["misc", "arg-type", "typeddict-item", "index", "union-attr", "call-overload"]

[[tool.mypy.overrides]]
module = ["test_session_tables"]
disable_error_code = ["misc", "typeddict-item", "arg-type", "return-value"]

[[tool.mypy.overrides]]
module = ["pi_durable.testing.storage_conformance"]
disable_error_code = ["arg-type", "call-overload", "index", "list-item", "misc", "typeddict-item", "union-attr"]

[[tool.mypy.overrides]]
module = ["test_testing_conformance", "storage_support"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["pi_durable.storage.jsonl.storage"]
disable_error_code = ["arg-type", "misc", "typeddict-item"]

[[tool.mypy.overrides]]
module = ["test_jsonl_storage", "test_env_filesystem"]
disable_error_code = ["arg-type", "call-overload", "list-item", "misc", "typeddict-item"]

[[tool.mypy.overrides]]
module = ["test_sqlite_storage"]
disable_error_code = ["call-overload", "index", "list-item", "misc", "typeddict-item"]

[[tool.mypy.overrides]]
module = ["pi_durable.harness.scheduler"]
disable_error_code = ["arg-type", "assignment", "call-overload", "index", "misc", "return-value", "typeddict-item"]
